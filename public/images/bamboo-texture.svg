<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="bamboo" x="0" y="0" width="100" height="600" patternUnits="userSpaceOnUse">
      <rect width="100" height="600" fill="#f4f6f2"/>
      <!-- Bamboo stalk -->
      <rect x="40" y="0" width="20" height="600" fill="#6b8a4f"/>
      <!-- Bamboo nodes -->
      <rect x="38" y="100" width="24" height="8" fill="#5a7247"/>
      <rect x="38" y="250" width="24" height="8" fill="#5a7247"/>
      <rect x="38" y="400" width="24" height="8" fill="#5a7247"/>
      <rect x="38" y="550" width="24" height="8" fill="#5a7247"/>
      <!-- Subtle leaves -->
      <path d="M60,150 Q80,140 70,120" fill="#8ca07b" opacity="0.7"/>
      <path d="M40,300 Q20,290 30,270" fill="#8ca07b" opacity="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bamboo)"/>
</svg>