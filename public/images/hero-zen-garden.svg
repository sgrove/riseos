<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mist" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f9f6f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f2ede3" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#f9f6f1"/>
  
  <!-- Raked sand circles -->
  <g stroke="#e8e0d0" stroke-width="1" fill="none" opacity="0.6">
    <circle cx="960" cy="540" r="100"/>
    <circle cx="960" cy="540" r="200"/>
    <circle cx="960" cy="540" r="300"/>
    <circle cx="960" cy="540" r="400"/>
    <circle cx="960" cy="540" r="500"/>
    <circle cx="960" cy="540" r="600"/>
    <circle cx="960" cy="540" r="700"/>
    <circle cx="960" cy="540" r="800"/>
  </g>
  
  <!-- Stones -->
  <circle cx="400" cy="380" r="40" fill="#1a1a1a"/>
  <circle cx="1200" cy="600" r="35" fill="#2d2d2d"/>
  <circle cx="700" cy="700" r="45" fill="#1a1a1a"/>
  
  <!-- Mist overlay -->
  <rect width="1920" height="1080" fill="url(#mist)" filter="url(#blur)"/>
</svg>